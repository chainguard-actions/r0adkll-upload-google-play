name: Test serviceAccountJson and tracks inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake service account json file and release file
        run: |
          echo '{"type":"service_account","project_id":"fake","private_key_id":"fake","private_key":"fake","client_email":"fake@fake.iam.gserviceaccount.com","client_id":"fake","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}' > /tmp/service-account.json
          echo "fake apk content" > /tmp/fake-release.apk

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJson: /tmp/service-account.json
          packageName: com.example.app
          releaseFile: /tmp/fake-release.apk
          tracks: internal,alpha
          status: completed

      - name: Assert action ran (fails gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
