name: Test debugSymbols and versionCodesToRetain inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake release file and debug symbols
        run: |
          echo "fake aab content" > /tmp/fake-release.aab
          echo "fake debug symbols" > /tmp/fake-debug-symbols.zip

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: '{"type":"service_account","project_id":"fake","private_key_id":"fake","private_key":"fake","client_email":"fake@fake.iam.gserviceaccount.com","client_id":"fake","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          packageName: com.example.app
          releaseFile: /tmp/fake-release.aab
          debugSymbols: /tmp/fake-debug-symbols.zip
          versionCodesToRetain: "100,101,102"
          track: internal
          status: completed

      - name: Assert action ran (fails gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
