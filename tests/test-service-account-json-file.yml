name: Test serviceAccountJson file input with mappingFile and whatsNewDirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake service account json file and supporting files
        run: |
          # Create a fake service account JSON file
          cat > /tmp/fake-service-account.json << 'EOF'
          {
            "type": "service_account",
            "project_id": "fake-project",
            "private_key_id": "fake-key-id",
            "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqKFPmBNpCzABBBBBBBB\n-----END RSA PRIVATE KEY-----\n",
            "client_email": "fake@fake-project.iam.gserviceaccount.com",
            "client_id": "123456789",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token"
          }
          EOF

          # Create a fake APK file
          echo "fake apk content" > /tmp/fake-release.apk

          # Create a fake mapping file
          echo "fake mapping content" > /tmp/fake-mapping.txt

          # Create a whats new directory with localized files
          mkdir -p /tmp/whatsnew
          echo "Bug fixes and performance improvements" > /tmp/whatsnew/whatsnew-en-US
          echo "Correcciones de errores" > /tmp/whatsnew/whatsnew-es-ES

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJson: /tmp/fake-service-account.json
          packageName: com.example.testapp
          releaseFile: /tmp/fake-release.apk
          track: internal
          status: completed
          mappingFile: /tmp/fake-mapping.txt
          whatsNewDirectory: /tmp/whatsnew

      - name: Assert action ran and failed gracefully with fake credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
