name: Test mappingFile, debugSymbols, userFraction, and versionCodesToRetain inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy files for mapping and debug symbols
        run: |
          echo "fake mapping content" > /tmp/mapping.txt
          echo "fake debug symbols" > /tmp/native-debug-symbols.zip
          echo "fake-aab-content" > /tmp/fake-release.aab

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: '{"type":"service_account","project_id":"fake","private_key_id":"fake","private_key":"-----BEGIN RSA PRIVATE KEY-----\nfake\n-----END RSA PRIVATE KEY-----\n","client_email":"fake@fake.iam.gserviceaccount.com","client_id":"fake","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          packageName: 'com.example.testapp'
          releaseFile: '/tmp/fake-release.aab'
          track: 'production'
          status: 'completed'
          userFraction: '0.1'
          mappingFile: '/tmp/mapping.txt'
          debugSymbols: '/tmp/native-debug-symbols.zip'
          versionCodesToRetain: '100,101,102'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
