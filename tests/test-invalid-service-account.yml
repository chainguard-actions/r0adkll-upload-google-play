name: Test invalid service account JSON graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy APK file for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-artifacts"
          echo "dummy apk content" > "$GITHUB_WORKSPACE/test-artifacts/app-release.apk"

      - id: action
        uses: .
        continue-on-error: true
        with:
          packageName: "com.example.testapp"
          releaseFile: "${{ github.workspace }}/test-artifacts/app-release.apk"
          track: "internal"
          status: "completed"
          serviceAccountJsonPlainText: '{"type":"service_account","project_id":"fake-project","private_key_id":"fake-key-id","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABQdRMFBBBBBBBBBBBBB\n-----END RSA PRIVATE KEY-----\n","client_email":"fake@fake-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'

      - name: Assert action failed gracefully due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
