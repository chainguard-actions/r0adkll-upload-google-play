name: Test serviceAccountJson with releaseFiles and releaseName
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy release files and whats-new directory
        run: |
          mkdir -p /tmp/whatsnew
          echo "Bug fixes and improvements" > /tmp/whatsnew/en-US.txt
          # Create a minimal fake .aab file (just needs to exist for input coverage)
          echo "fake-aab-content" > /tmp/fake-release.aab
          echo "fake-aab-content-2" > /tmp/fake-release2.aab

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJson: '{"type":"service_account","project_id":"fake","private_key_id":"fake","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABQbKAuHFMRpBCMBrCBe\nfake\n-----END RSA PRIVATE KEY-----\n","client_email":"fake@fake.iam.gserviceaccount.com","client_id":"fake","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          packageName: 'com.example.testapp'
          releaseFiles: '/tmp/fake-release.aab,/tmp/fake-release2.aab'
          releaseName: 'Test Release 1.0'
          track: 'internal'
          status: 'draft'
          whatsNewDirectory: '/tmp/whatsnew'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
