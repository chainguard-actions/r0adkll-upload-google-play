name: Test missing credentials graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy APK file for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-artifacts"
          echo "dummy apk content" > "$GITHUB_WORKSPACE/test-artifacts/app-release.apk"

      - id: action
        uses: .
        continue-on-error: true
        with:
          packageName: "com.example.testapp"
          releaseFile: "${{ github.workspace }}/test-artifacts/app-release.apk"
          track: "internal"
          status: "completed"
          # No serviceAccountJson or serviceAccountJsonPlainText provided

      - name: Assert action failed gracefully due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no credentials provided)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
