name: Test missing service account credentials validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy APK file
        run: |
          echo "dummy apk content" > "$GITHUB_WORKSPACE/app-release.apk"

      - id: action
        uses: .
        continue-on-error: true
        with:
          packageName: 'com.example.testapp'
          releaseFile: 'app-release.apk'
          track: 'production'
          status: 'completed'
          # Intentionally omitting serviceAccountJson and serviceAccountJsonPlainText

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no service account credentials are provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without service account credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
