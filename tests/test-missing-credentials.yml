name: Test missing credentials fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy APK file
        run: |
          mkdir -p /tmp/test-artifacts
          echo "dummy apk content" > /tmp/test-artifacts/app-release.apk

      - id: action
        uses: .
        continue-on-error: true
        with:
          packageName: com.example.testapp
          releaseFile: /tmp/test-artifacts/app-release.apk
          track: internal
          status: completed
          # No serviceAccountJson or serviceAccountJsonPlainText provided

      - name: Assert action failed gracefully without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no credentials provided)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
