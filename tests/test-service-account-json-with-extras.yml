name: Test serviceAccountJson with mappingFile and whatsNewDirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy release file
        run: |
          echo "dummy" > /tmp/app-release.apk

      - name: Create dummy mapping file
        run: |
          echo "dummy mapping" > /tmp/mapping.txt

      - name: Create whats new directory
        run: |
          mkdir -p /tmp/whatsnew
          echo "Bug fixes and improvements" > /tmp/whatsnew/whatsnew-en-US

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJson: /tmp/fake-service-account.json
          packageName: com.example.app
          releaseFile: /tmp/app-release.apk
          track: internal
          status: completed
          mappingFile: /tmp/mapping.txt
          whatsNewDirectory: /tmp/whatsnew

      - name: Assert action ran (failed gracefully with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid/missing credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
