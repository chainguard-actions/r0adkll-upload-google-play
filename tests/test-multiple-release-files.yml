name: Test multiple release files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy APK files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/multi"
          echo "dummy apk content arm64" > "$GITHUB_WORKSPACE/tests/fixtures/multi/app-arm64.apk"
          echo "dummy apk content x86" > "$GITHUB_WORKSPACE/tests/fixtures/multi/app-x86.apk"

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: '{"type":"service_account","project_id":"test","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABQGAKuMBqMBqMBqMBqM\n-----END RSA PRIVATE KEY-----\n","client_email":"test@test.iam.gserviceaccount.com","client_id":"123","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          packageName: 'com.example.testapp'
          releaseFiles: '${{ github.workspace }}/tests/fixtures/multi/*.apk'
          track: 'alpha'
          status: 'completed'
          inAppUpdatePriority: '3'

      - name: Assert action ran and failed gracefully (invalid credentials, multiple files)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but not a test failure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
