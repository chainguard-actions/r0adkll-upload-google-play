name: Test multiple release files with glob pattern fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy APK files
        run: |
          mkdir -p /tmp/test-artifacts
          echo "dummy apk content arm64" > /tmp/test-artifacts/app-arm64-release.apk
          echo "dummy apk content x86" > /tmp/test-artifacts/app-x86-release.apk

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: |
            {
              "type": "service_account",
              "project_id": "fake-project",
              "private_key_id": "key123",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABQbXQgFBGGGGGGGGGGG\n-----END RSA PRIVATE KEY-----\n",
              "client_email": "fake-service-account@fake-project.iam.gserviceaccount.com",
              "client_id": "123456789",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token"
            }
          packageName: com.example.testapp
          releaseFiles: /tmp/test-artifacts/app-arm64-release.apk,/tmp/test-artifacts/app-x86-release.apk
          track: internal
          status: completed
          inAppUpdatePriority: '2'

      - name: Assert action failed gracefully with fake credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fake credentials rejected by Google Play API)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
