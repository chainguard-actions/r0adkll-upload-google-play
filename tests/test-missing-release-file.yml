name: Test missing release file graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          packageName: "com.example.testapp"
          track: "production"
          status: "completed"
          serviceAccountJsonPlainText: '{"type":"service_account","project_id":"fake-project","private_key_id":"fake-key-id","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABQdRMFBBBBBBBBBBBBB\n-----END RSA PRIVATE KEY-----\n","client_email":"fake@fake-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          # No releaseFile or releaseFiles provided

      - name: Assert action failed gracefully due to missing release file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no release file provided)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without a release file"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
