name: Test internal sharing track fails gracefully with fake credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy APK file
        run: |
          mkdir -p /tmp/test-artifacts
          echo "dummy apk content" > /tmp/test-artifacts/app-release.apk

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: |
            {
              "type": "service_account",
              "project_id": "fake-project",
              "private_key_id": "key123",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABQbXQgFBGGGGGGGGGGG\n-----END RSA PRIVATE KEY-----\n",
              "client_email": "fake-service-account@fake-project.iam.gserviceaccount.com",
              "client_id": "123456789",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token"
            }
          packageName: com.example.testapp
          releaseFile: /tmp/test-artifacts/app-release.apk
          track: internalsharing

      - name: Assert action outcome and output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DOWNLOAD_URL: ${{ steps.action.outputs.internalSharingDownloadUrl }}
        run: |
          echo "outcome: $OUTCOME"
          echo "internalSharingDownloadUrl: $DOWNLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, the download URL should be set
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "FAIL: action succeeded but internalSharingDownloadUrl output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with download URL: $DOWNLOAD_URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fake credentials rejected by Google Play API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
