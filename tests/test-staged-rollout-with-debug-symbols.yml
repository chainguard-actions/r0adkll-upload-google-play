name: Test userFraction staged rollout with debugSymbols
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake release files and debug symbols
        run: |
          # Create a fake AAB file
          echo "fake aab content" > /tmp/fake-release.aab

          # Create a fake debug symbols zip
          mkdir -p /tmp/debug-symbols-dir
          echo "fake debug symbols" > /tmp/debug-symbols-dir/libfoo.so.sym
          zip -j /tmp/fake-debug-symbols.zip /tmp/debug-symbols-dir/libfoo.so.sym

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: '{"type":"service_account","project_id":"fake","private_key_id":"fake","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqKFPmBNpCzABBBBBBBB\n-----END RSA PRIVATE KEY-----\n","client_email":"fake@fake.iam.gserviceaccount.com","client_id":"123","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          packageName: com.example.testapp
          releaseFile: /tmp/fake-release.aab
          track: rollout
          status: inProgress
          userFraction: '0.1'
          debugSymbols: /tmp/fake-debug-symbols.zip

      - name: Assert action ran and failed gracefully with fake credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
