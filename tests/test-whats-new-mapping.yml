name: Test whats-new directory and mapping file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy release artifacts and whats-new directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/whatsnew"
          echo "dummy aab content" > "$GITHUB_WORKSPACE/tests/fixtures/app-release.aab"
          echo "dummy mapping content" > "$GITHUB_WORKSPACE/tests/fixtures/mapping.txt"
          echo "Bug fixes and performance improvements." > "$GITHUB_WORKSPACE/tests/fixtures/whatsnew/whatsnew-en-US"
          echo "Correcciones de errores y mejoras de rendimiento." > "$GITHUB_WORKSPACE/tests/fixtures/whatsnew/whatsnew-es-ES"

      - id: action
        uses: .
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: '{"type":"service_account","project_id":"test","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABQGAKuMBqMBqMBqMBqM\n-----END RSA PRIVATE KEY-----\n","client_email":"test@test.iam.gserviceaccount.com","client_id":"123","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          packageName: 'com.example.testapp'
          releaseFile: '${{ github.workspace }}/tests/fixtures/app-release.aab'
          track: 'production'
          status: 'completed'
          userFraction: '0.1'
          whatsNewDirectory: '${{ github.workspace }}/tests/fixtures/whatsnew'
          mappingFile: '${{ github.workspace }}/tests/fixtures/mapping.txt'
          changesNotSentForReview: 'false'

      - name: Assert action ran and failed gracefully (invalid credentials, with whats-new and mapping)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but not a test failure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
